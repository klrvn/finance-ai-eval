    tol: 0
    decimals: 2
    grounding: true
    methodology: true
    description: "中兴通讯 2023FY 存货期末余额（亿元 CNY）"
  ZTE_2024_net_profit:
    type: number
    tol: 0
    decimals: 2
    grounding: true
