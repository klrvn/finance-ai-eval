# S10 三家公司三年财务数据获取 — 检查点 schema
#
# 27 个数值检查点 = 3 家公司 × 3 财年 × 3 指标
#   (net_profit 归母净利润 / roe 加权净资产收益率 / inventory 存货期末余额)。
#   命名: <COMPANY>_<FY>_<METRIC>, COMPANY ∈ {ZTE, POPMART, NVDA}。
#   财年窗口按公司而定（非全局统一）:
#     ZTE / POPMART : 2023 / 2024 / 2025（自然年报表）
#     NVDA          : 2024 / 2025 / 2026（NVIDIA 财年在次年 1 月末结束, FY2026 结束于 2026-01-25,
#                     故截至数据截止日 2026-07-20 其最近三个已报告财年为 FY2024/FY2025/FY2026）
#
# GT 值单一数据源: 计算器 financial_data_snapshot.py 内嵌的冻结答案键
#   (fixtures/groundtruth_snapshot.json 为其可读镜像/可选 override)
#   → data_retrieval / gt_dispatch(kind:calculator) → groundtruth.json values[<field>]
#   → grader 从 groundtruth.json 取真值比较（不从本文件 description 读数值）。
#   更新 GT 只需改答案键一处, 本文件无需同步修改。
#
# 评分模式: 二元通过/失败（超容差即零分, CF5）。
#   - 所有数值检查点 tol = 0（精确匹配）。理由: 数据获取任务要求精确性——
#     答案在按题设口径四舍五入后必须与基准真值完全一致, 不给部分分。
#   - 每个数值检查点显式声明 decimals（生效精度）, 使 tol=0 真正为 0:
#       number (net_profit/inventory) -> decimals: 2（亿元/亿美元 2 位小数）
#       pct    (roe)                  -> decimals: 4（GT 经 percent_canon 除以 100 转为
#                                        fraction, 故"百分数 2 位小数" == "分数 4 位小数"）
#     若不声明, grader 会从 repr(GT) 推断精度, 而 repr(728.80) == '728.8' 只有 1 位小数,
#     导致 728.84 被四舍五入为 728.8 而误判 PASS——即在声明 tol=0 之下隐含 ±0.05 的实际容差。
#     显式 decimals 消除该漏洞；作答仍可给出更高精度（728.804 → 四舍五入到 728.80 → PASS）。
#   - net_profit / inventory: 单位 亿（CNY 或 USD）, 四舍五入 2 位小数。
#   - roe: 百分比数值（如 15.19 表示 15.19%）, 四舍五入 2 位小数。
#
# 每个数值检查点同时标 grounding:true 与 methodology:true:
#   - grounding: 数值是否匹配 GT（数据获取正确性 → D1 第一层基线）。
#   - methodology: 口径/单位/财年/四舍五入是否正确（值正确即证据 → D2 第一层基线）,
#     并由盲评 + 结构 caliber_* 字段交叉验证。
#   grounding 检查点默认等权: 每家公司恰 9 个 → 三家在客观锚定中自然均衡（无需 group_weights）。
#
# 结构检查点（present, methodology:true）验证口径/单位/财年声明, 非数值比较:
#   - caliber_net_profit / caliber_roe / caliber_inventory: 是否声明并使用正确口径
#   - caliber_unit_currency: 货币与单位口径是否正确（中兴/泡泡玛特 CNY 亿元; 英伟达 USD 亿美元; 不跨币种换算）
#   - caliber_fiscal_year: 财年口径是否正确（英伟达按其 1 月末结束的财年对应 FY2024/FY2025/FY2026,
#     而非自然年错配、也非把最近三财年误取为 FY2023-FY2025）
#
# data_source_per_company (count_min, methodology): 每家公司都应声明数据来源（共 3 家）。
#
# CF5: 超容差的数值检查点记 0 分（不给部分分）。
# CF4: 用明显陈旧数据冒充最新（中兴/泡泡玛特把 2024FY 当作最新而漏 2025FY；
#      英伟达把 FY2025 当作最新而漏 FY2026）→ D1 封顶为等级 1。
# CF1: 捏造财务数字/来源 → 提议给人工, 确凿证据方可封顶总分。

fields:
