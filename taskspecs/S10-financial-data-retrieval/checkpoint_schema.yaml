  ZTE_2023_net_profit:
    type: number
    tol: 0
    decimals: 2
    grounding: true
    methodology: true
    description: "中兴通讯 2023FY 归母净利润（亿元 CNY）"
  ZTE_2023_roe:
    type: pct
    tol: 0
    decimals: 4
    grounding: true
    methodology: true
    description: "中兴通讯 2023FY 加权净资产收益率（%）"
  ZTE_2023_inventory:
