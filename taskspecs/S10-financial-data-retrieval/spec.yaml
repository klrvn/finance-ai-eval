task_id: S10
version: 1.1.1
family: data-retrieval
tier: T1
persona: 研究员
prompt_text: >
  金融数据获取任务 — 三家公司最近三年财务数据。

  Your role: Financial data analyst on a research desk.
  Situation: Retrieve, for each of the three companies below, THREE financial figures for each of
  their most recent three fiscal years (2023FY / 2024FY / 2025FY), using the exact calibers,
  currency/unit, and rounding stated. Report each figure with its data source.

  --- Companies ---
    中兴通讯   000063.SZ  A股(深交所)  报表货币 人民币(CNY)   数据单位 亿元
    泡泡玛特   09992.HK   港股(港交所)  报表货币 人民币(CNY)   数据单位 亿元
    英伟达     NVDA.O     美股(纳斯达克) 报表货币 美元(USD)     数据单位 亿美元

  --- Metrics (retrieve all three, for each company, for each of 2023FY/2024FY/2025FY) ---
    1. 净利润 (Net profit)
    2. 净资产收益率 (ROE)
    3. 存货 (Inventory)

  --- Caliber definitions (统一口径, 必须严格遵循) ---
    净利润      : 归属母公司股东的净利润 (归母净利润), NOT 合并净利润总额.
    净资产收益率 : 使用加权净资产收益率 (weighted ROE), NOT 摊薄/期末 ROE.
    存货        : 资产负债表 "存货 / Inventories" 期末余额 (period-end), NOT 平均.

  --- Currency & unit ---
    中兴通讯 / 泡泡玛特 : 人民币(CNY), 亿元.
    英伟达            : 美元(USD), 亿美元.
    Report each company's figures in its own reporting currency; do NOT convert across currencies.

  --- Fiscal-year convention ---
    中兴通讯 / 泡泡玛特 : 财年为自然年 (截止 12-31); 2023FY/2024FY/2025FY = 2023/2024/2025 年报.
    英伟达            : 财年在次年 1 月末结束 (NVIDIA fiscal year); FY2025 结束于 2025-01,
                        FY2024 结束于 2024-01, FY2023 结束于 2023-01. 以 NVIDIA 财年口径对应
                        2023FY/2024FY/2025FY, 而非按自然年错配.

  --- Rounding ---
    净利润 与 存货 : 四舍五入到 2 位小数.
    净资产收益率   : 四舍五入到百分比后 2 位小数 (例如 10.34%).

  --- Data as-of ---
    数据截止日 2026-07-20. Use the officially reported annual figures for each fiscal year.

  --- Required deliverables ---
    For each company, for each of the three fiscal years, report:
      1. 净利润 (归母), 净资产收益率 (加权), 存货 (期末) — with the correct unit/currency.
      2. The data source for the figures (filing / data API / tool name + as-of).
    State the caliber you used for each metric so the reader can confirm 口径一致.

  Ground Rules:
    - Retrieve the actual reported figures — do not use memorized or approximate values.
    - State the data source for every quantitative claim.
    - Use the exact caliber, currency/unit, fiscal-year convention, and rounding specified above.
measurable_outputs:
  - 27 个数值答案（3 家公司 × 3 财年 × {归母净利润, 加权净资产收益率, 存货期末余额}）, 每个按指定货币单位与四舍五入口径呈现
  - 每家公司的数据来源声明（filing / 数据 API / 工具名称 + as-of）
  - 口径正确性（归母净利润 / 加权ROE / 存货期末余额 的口径选择与题目一致）
  - 货币与单位正确性（中兴/泡泡玛特 CNY 亿元；英伟达 USD 亿美元；不跨币种换算）
  - 财年口径正确性（英伟达按其 1 月末结束的财年对应, 而非自然年错配）
rubric_weights: {D1: 60, D2: 12, D3: 8, D4: 0, D5: 0, D6: 20}
objective_dims: [D1, D2]
# v1.1.0 权重: D1:60 D2:12 D3:8 D6:20 = 100（较 S9 的 40/20/15/25 更向 D1 集中）。
#   D1=60：本任务为"确定答案"型数据获取，取数正确性与来源依据即任务本身，故为绝对主导维度。
#   D6=20：工具链是本家族第二关键维度——"是否真的用 API/工具取数, 而非凭记忆给数"是 D1
#     无法观测的失败模式（27 个数字可以全对却全靠背诵）, 因此保留显著权重。
#   D2=12：口径纪律（归母 / 加权 / 期末余额）是独立失败模式——数字对但口径错。
#   D3=8：完整性削减最多, 因其已被 D1 大幅重复计量（漏一个数据点即已使对应 grounding
#     检查点失败, 而 D1 权重为 60）；D3 仅保留对"交付结构性缺失"的独立惩罚。
#   D4 权重=0（取消评分, 其分析洞察在 D2 方法正确性中间接体现）。
#   D5 权重=0（取消评分, 其可操作性锚点——as-of 标注、来源可复现性——转移至 D2）。
# D1 客观 fraction 内部权重: citation 0.3 / grounding 0.7（与 S9 一致：27 个 grounding
#   检查点是核心, 引用抽样核验占 0.3）。grounding 检查点默认等权（每家公司恰 9 个 → 三家均衡）。
# D1 第二层沿用 data-retrieval 家族通行的来源含金量三级锚点（见 judge_notes.md）。
d1_objective_weights: {citation: 0.3, grounding: 0.7}
citation_policy: {mode: sample, k: 5}
cf_rules: [CF1, CF4, CF5]
cf_thresholds: {}
required_inputs:
  - name: groundtruth_snapshot.json
    needed_for: "GT 答案键的可读镜像 / 可选 override；默认 GT 为计算器内嵌的冻结答案键"
    na_policy: "计算器默认使用内嵌答案键, 不依赖此文件；提供 --snapshot 时覆盖内嵌键"
task_validators:
  - {name: data_source_completeness, realized_by: "盲评 D1 关注点 + data_source_per_company (count_min, methodology)"}
  - {name: caliber_correctness, realized_by: "checkpoint caliber_* 字段（methodology:true）+ 各数值检查点 methodology 标注"}
  - {name: currency_unit_correctness, realized_by: "checkpoint caliber_unit_currency（methodology:true）"}
  - {name: fiscal_year_correctness, realized_by: "checkpoint caliber_fiscal_year（methodology:true）"}
engine_requirements:
  calculator: financial_data_snapshot
  gt_kind: calculator
  gt_version: "1.0"
  checkpoint_types: [number, pct, present, count_min]
  tolerance_policy: >
    所有数值检查点 tol=0（精确匹配, 按题设四舍五入口径后与 GT 完全相等才得分）。
    每个数值检查点显式声明 decimals（number=2 / pct=4，pct 因 percent_canon 已转为 fraction 口径）,
    使 tol=0 在引擎层真正生效：不声明时 grader 从 repr(GT) 推断精度, 而 repr(728.80)=='728.8'
    会引入 ±0.05 的隐含容差。作答仍允许更高精度（728.804 → 四舍五入至 728.80 → 通过）。
  requires_grader_feature: "compare_scalar 支持 checkpoint 级 decimals（tol=0 精度锚定）"
  data_fetch_mode: "snapshot (frozen answer key from company filings, embedded in calculator)"
  min_grader_version: "1.1"   # 需要支持 checkpoint 级 decimals 的 grader
  min_aggregator_version: "2.3"
