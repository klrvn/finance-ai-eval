task_id: S7
version: 1.1.0
family: fund-screen
tier: T2
persona: 基金筛选师
prompt_text: >
  Screen from the provided candidate pool of 30 equity ETFs (see candidate_pool.yaml for the full list
  with codes and names) and give a shortlist of five, with a comparison table containing: 3-year and
  5-year annualized return, annualized volatility, Sharpe ratio, max drawdown, expense ratio, AUM, and
  a holdings-overlap note. All metrics are as of 2026-07-10. Add a one-line recommendation for a
  moderate-risk, long-term investor and rank the five. The five selected funds must all come from the
  30-fund candidate pool; selections outside the pool are invalid.
measurable_outputs:
  - 五行的表，八个指定列均填满
  - 带适配性理由的排序推荐
  - 五只基金均来自候选池（代码可核验）
  - 来源与截至日期（2026-07-10）
rubric_weights: {D1: 15, D2: 20, D3: 15, D4: 20, D5: 10, D6: 20}
objective_dims: [D1]                  # 有固定候选池+权威 NAV，D1 可客观核验池成员身份与 as-of 日期
citation_policy: {mode: per_cell_sample}
cf_rules: [CF1, CF2, CF4]
cf_thresholds: {CF2_uncited_ratio: 0.25}
required_inputs:
  - name: candidate_pool.yaml
    needed_for: "候选池成员身份核验（shortlist_from_pool 检查点）"
    na_policy: "缺失 -> shortlist_from_pool NA"
  - name: fund_navs_30.7z
    needed_for: "metric_cells_verified 抽样核验（fund_metrics 计算器，30 只基金 5 年 NAV CSV 打包）"
    na_policy: "无权威 NAV -> 单元格检查 NA；表格完整性与适配性仍评分"
  - name: static.csv
    needed_for: "费率/AUM 透传（fund_metrics 计算器）"
    na_policy: "缺失 -> expense_ratio/aum 检查点 NA"
task_validators:
  - {name: suitability_consistency, realized_by: "盲评 D5 关注点：排序是否契合'中等风险长期'画像（矛盾 -> D5 封顶证据）"}
engine_requirements:
  calculator: fund_metrics
  gt_kind: calculator
  checkpoint_types: [count_eq, present, sample_verify, set_match]
  min_grader_version: "1.0"
  min_aggregator_version: "2.0"
