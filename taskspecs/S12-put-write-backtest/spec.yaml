task_id: S12
version: 1.0.0
family: quant-backtest
tier: T1
persona: 量化研究员

prompt_text: >
  模拟一个 Put-Writing 策略在 2020-01-01 至 2025-12-31（六个完整年度）的表现。

  策略组：95% 配置中债-综合财富（总值）指数（口径为财富/总值，含债券价格、应计利息与付息再投资，
  非净价、非全价）；5% 作为保证金，持续卖出沪深 300 ETF 看跌期权收取权利金——DTE 30-50 天、
  delta 约 -0.2、行权价约标的现价 90%-95%，到期或临近到期按同规则换仓滚动。

  对照组：95% 同上中债-综合财富（总值）指数 + 5% 持有沪深 300 ETF。

  两组均按年度再平衡回到 95/5 目标权重。

  需要交付：
  (1) 两组 × 五项指标对比表——累计收益率、年化收益率、最大回撤、年化波动率、夏普比率，共 10 个数值；
  (2) 两个指数 2020-2025 的逐年回报，作为上述指标的计算依据；
  (3) 收益增强来源说明——权利金的来源机制，增强最明显与跑输的市场环境；
  (4) 回撤特征差异分析——对比两种做法的回撤形态而非只比数值；
  (5) 口径与关键假设披露——债底仓指数口径、卖沽标的（510330 在 2020-2025 无实盘挂牌期权，
      上交所/深交所标的分别为 510300/159919，须说明实际使用哪个及理由）、保证金与杠杆假设、
      无风险利率取值、年化计算方式与波动率数据频率、是否计入交易成本。

  历史期权权利金没有公开的权威逐月序列；若策略指标建立在定价假设之上，须说明假设内容并给出区间。

measurable_outputs:
  - 策略组与对照组各 5 项指标（累计收益、年化收益、最大回撤、年化波动率、夏普比率）
  - 中债-综合财富（总值）指数 2020-2025 逐年回报（6 个数值，财富口径）
  - 对照组年化收益率（可由逐年回报 + 年度再平衡确定性推导）
  - 计算链自洽性：累计与年化互推闭合、夏普比率与自报的收益/rf/波动率闭合、跨组差异与袖子收益闭合
  - 中间量披露：无风险利率取值、两组袖子收益、再平衡口径声明、波动率数据频率声明
  - 口径与假设披露：债底仓财富口径、510330 代理标的说明、保证金与名义敞口

# ---------------------------------------------------------------------------
# 权重：专注探针定位——本容器测的是「回测计算链是否自洽」，不是完整投研品质评测。
#   D2:35 最高，因为一致性闭合是容器主旨
#   D6:15 次高，「有没有真的算」与一致性高度互补（CF3 未启用，此惩罚由 D6 独担）
#   D1:25 市场数据准确性（外部锚定）
#   D3:15 题面点名交付物的完整性
#   D4:10 定性分析质量（IRAB 原题考点保留但不主导）
#   D5:0  历史回测复盘不涉及投资建议
# ---------------------------------------------------------------------------
rubric_weights: {D1: 25, D2: 35, D3: 15, D4: 10, D5: 0, D6: 15}

objective_dims: [D1, D2]
objective_scoring_mode: binary

# T1 的适用范围说明（重要）：
#   本任务的 tier 标为 T1，指的是「输入层与方法层可确定性核验」——
#   输入层（中债逐年回报）有外部真值，方法层（计算链闭合关系）有可执行的内部真值路径。
#   但**输出层（策略组的五项指标）不存在唯一真值**：历史期权权利金无公开权威序列，
#   且结果取决于 IV、保证金口径、换仓滑点等定价假设，属模型依赖而非数据缺失。
#   因此策略组指标一律以内部类型（reconcile/consistency/present）承载，不设点值 GT。
#   全部 NEEDS_GT 类型的检查点（7 个 pct）都有真实真值路径，无伪确定性。

citation_policy: {mode: sample, k: 4}
# 4 条承重引用：中债指数数据源、沪深300 指数数据源、510330 期权挂牌事实、保证金规则

cf_rules: [CF1, CF2, CF5]
# CF3（只描述不执行）未启用——「没真算」的惩罚交由 D6 扣分承担（最重 -2 使该维度归零，
#   损失 15 权重），叠加捏造数字几乎必然通不过一致性闭合对 D2:35 的打击。
#   相比 CF3 一刀切把 D2+D3=50 权重封顶到等级 1，这个组合按错误严重程度逐笔累积，更精准。
# CF4（陈旧数据当当前用）未启用——本任务是固定历史区间回测，不存在「当前数据」场景。
cf_thresholds:
  CF2_uncited_ratio: 0.25

d1_objective_weights: {citation: 0.3, grounding: 0.7}
# 沿用 data-retrieval 家族（S9/S10）的比例。grounding 腿为 6 个中债逐年检查点。

# grounding_group_weights 未声明：6 个逐年检查点等权，各年同等重要。

required_inputs:
  - name: groundtruth_snapshot.json
    needed_for: "冻结快照（中债逐年回报 + 沪深300 全收益逐年回报）；计算器已内嵌，此文件为可读镜像/可选 override"
    na_policy: "缺失不影响运行——计算器内嵌冻结答案键，网络无关"

task_validators:
  - {name: bond_caliber_discipline, realized_by: "checkpoint bond_2020..bond_2025（财富口径，净价/全价会整体偏离约 3%/年，紧容差可捕获）"}
  - {name: computation_chain_closure, realized_by: "checkpoint strategy/benchmark 的累计-年化互推、夏普闭合、跨组差异闭合"}
  - {name: intermediate_disclosure, realized_by: "checkpoint intermediate_disclosure_count（count_min，5 项中至少 3 项）"}
  - {name: proxy_and_assumption_honesty, realized_by: "盲评 D1/D2 第二层锚点 + present 检查点 proxy_disclosed"}

engine_requirements:
  calculator: put_write_snapshot
  gt_kind: calculator
  gt_version: "1.0"
  checkpoint_types: [pct, present, count_min, reconcile, consistency]
  tolerance_policy: >
    中债逐年回报：官方/媒体披露值（2021、2024）tol 0.002；公开基准推算值（2020、2022、2023、2025）
    tol 0.005。对照组年化 tol 0.0015——恰好容纳沪深300 全收益口径与价格指数口径两种合法选择
    （二者年化相差约 13bp），口径优劣由 D1 第二层锚点承载而非在第一层判错。
    闭合检查点的容差按导数不对称设定：由累计推年化 tol 0.001（灵敏度约 0.135，输入舍入被压缩）；
    由年化推累计 tol 0.004（灵敏度约 7.3，输入舍入被放大 6 年复利）。
    夏普闭合用 rel:true tol 0.06——低波动组合（σ≈2%）的分母很小，年化收益的 0.1pp 舍入会
    放大约 55 倍到夏普上，绝对容差会误杀 1 位小数报告的正确答案。
  data_fetch_mode: "frozen_snapshot（网络无关，计算器内嵌冻结逐年序列）"
  min_grader_version: "1.0"
  min_aggregator_version: "2.3"
