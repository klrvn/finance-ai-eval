task_id: S4
version: 2.1.0
family: multifactor-attribution
tier: T2
persona: 量化研究员 / 投资组合经理
prompt_text: >
  S4 归因分析任务指引。

  任务目标：将沪深300指数相对于中证500指数在指定时间区间内的收益差异，拆解为以下三个效应层级：
  (1) 行业配置效应 — 因超配/低配某些行业而产生的超额收益贡献
  (2) 风格因子暴露效应 — 因在 CNE5 风格因子上的暴露差异而产生的超额收益贡献
  (3) 个股选择效应 — 扣除上述两项后的残差超额收益

  归因恒等式：超额收益 = 行业配置效应 + 风格因子暴露效应 + 个股选择效应。
  其中"超额收益"指沪深300相对于中证500的收益差（组合收益减去基准收益）。若该值为负，表示
  沪深300跑输中证500。

  --- 口径定义 ---

  2.1 时间范围：
  起始日期 2023-07-16，结束日期 2026-07-15，时间类型为固定区间（非滚动窗口）。
  归因频率：月频（每月末最后一个交易日为归因时点）。

  2.2 指数与收益口径：
  沪深300：组合（P），价格指数 Ticker 000300.SH，全收益指数 Ticker H00300.CSI
  中证500：基准（B），价格指数 Ticker 000905.SH，全收益指数 Ticker H00905.CSI
  收益口径：全收益指数（含分红再投资）。使用全收益指数而非价格指数，以消除分红除权对收益的影响。

  2.3 行业分类：
  分类体系：申万一级行业（SW Level 1，共31个行业）
  权重基础：自由流通市值（Free-float Market Cap）加权
  分类时点：每月末最后一个交易日快照

  2.4 Brinson 模型：
  模型类型：Brinson-Fachler（BF）
  交互效应处理：并入个股选择效应，不单独列示
  BF 行业配置效应：以组合与基准在各行业权重之差，乘以基准各行业收益率与基准整体收益率之差来计算。
  交互效应并入后的个股选择效应：以组合与基准在各行业权重之差调整后的系数，乘以组合与基准在各行业
  收益率之差来计算。

  2.5 归因层级顺序：
  第一层 行业配置效应：直接基于 BF 公式计算
  第二层 风格因子暴露效应：基于扣除行业配置效应后的剩余收益计算
  第三层 个股选择效应（残差）：超额收益扣除前两层效应后的残差
  即：风格因子暴露效应是对"超额收益 - 行业配置效应"的进一步分解，个股选择效应是最终残差。

  --- CNE5 风格因子口径 ---

  3.1 因子清单：
  Size (LNCAP) 市值因子（对数总市值）
  Beta (BETA) 市场敏感度因子
  Momentum (RSTR) 动量因子（过去12个月剔除最近1个月的累计收益）
  Residual Volatility (ResVOL) 残差波动率因子
  Non-linear Size (NLSIZE) 非线性市值因子
  Book-to-Price (BTOPL) 账面价值比因子
  Liquidity (LIQUIDTY) 流动性因子
  Earnings Yield (EARNYILD) 盈利预期因子
  Growth (GROWTH) 成长因子

  3.2 暴露与收益口径：
  因子暴露来源：系统内置因子数据接口（A股日频因子宽表）
  暴露值口径：原始暴露值（非标准化）用于计算指数层面暴露
  指数层面暴露计算：成分股暴露值以自由流通市值加权聚合至指数层面
  因子收益获取方式：Fama-MacBeth 截面回归（每月一次，以因子暴露对次月收益回归）
  回归权重：自由流通市值的平方根
  回归范围：全A股（非仅限沪深300或中证500成分股）

  3.3 因子暴露效应：
  针对每个因子，风格因子暴露效应 = 组合与基准在因子上的暴露之差 × 该因子当月收益率。
  总风格因子效应 = 9 个因子暴露效应之和。

  --- 成分股处理口径 ---

  成分股列表时点：每月末最后一个交易日的指数成分股快照
  定期调整：按指数公司公告的生效日处理（沪深300和中证500均为每半年调整）
  临时调整：按指数公司公告的实际生效日处理
  权重更新：每月末更新成分股权重，不使用期初固定权重
  行业分类变动：以每月末时点的申万行业分类为准

  --- 数值精度 ---

  收益率：保留4位小数（0.01%）
  权重：保留2位小数（0.01%）
  因子暴露值：保留4位小数
  因子收益：保留4位小数
  归因贡献：保留4位小数

  --- 残差的经济含义说明 ---

  个股选择效应作为残差项，衡量的是在控制行业配置差异和风格因子暴露差异后剩余的超额收益。
  由于沪深300和中证500均为被动指数，该残差不反映主动选股能力，而是反映两个指数在成分股构成上的
  结构性差异，以及 CNE5 因子体系未能捕捉的其他系统性风险溢价。
measurable_outputs:
  - 沪深300 相对中证500 在 2023-07-16 ~ 2026-07-15 区间的累计收益差（数值）
  - 行业配置效应：分行业（申万一级，31个）的拖累/贡献，指出主要拖后腿的行业
  - 风格因子暴露效应：覆盖全部 9 个 CNE5 因子（LNCAP/BETA/RSTR/ResVOL/NLSIZE/BTOPL/LIQUIDTY/EARNYILD/GROWTH）的暴露差与收益贡献
  - 个股选择效应（Brinson-Fachler 残差）
  - 三项效应之和与总收益差的勾稽（归因恒等式）
  - 月频归因结果（每月末时点）
rubric_weights: {D1: 20, D2: 20, D3: 15, D4: 20, D5: 5, D6: 20}
objective_dims: [D2]
citation_policy: {mode: sample, k: 5}
cf_rules: [CF1, CF3, CF5]
required_inputs:
  - name: index_constituents_and_returns
    needed_for: "两指数（沪深300 H00300.CSI / 中证500 H00905.CSI）的行业权重/收益（行业配置与选择效应）；每月末成分股快照"
    na_policy: "作品自取；magnitudes 靠引用核验，三效应之和对总差的勾稽始终可查"
  - name: cne5_factor_exposures
    needed_for: "CNE5 风格因子暴露效应（9 因子，日频因子宽表，自由流通市值加权聚合至指数层面）"
    na_policy: "作品自取；因子归因无共享计算器，数值不做客观核验（无 GT），靠盲评 D2 + 引用"
task_validators:
  - {name: decomposition_reconciliation, realized_by: "checkpoint decomposition_reconciles (consistency: 三效应之和 == 总收益差)"}
  - {name: sector_leg_optional_calculator, realized_by: "若提供两指数的行业级 w/r 样本，可用共享 brinson 计算器客观核验配置/选择腿（见 gt_recipe）"}
  - {name: factor_leg_methodology, realized_by: "盲评 D2/D4：CNE5 因子暴露与收益贡献的方法是否正确、是否落到具体因子"}
engine_requirements:
  calculator: none                 # 默认 must-fetch；可选 brinson 覆盖行业腿（见 gt_recipe）
  gt_kind: internal_consistency
  checkpoint_types: [present, consistency, count_min]
  min_grader_version: "1.0"
  min_aggregator_version: "2.0"
