# ---------------------------------------------------------------------------
# percent_fields 故意不声明: 计算器已把 pct 类型量输出为 fraction 刻度, 与提取器
# validators.py 的规范化结果同刻度。
# ---------------------------------------------------------------------------

design_note: >
  真值分两类。第一类(44个GT键): 五粮液FY2025会计差错更正前后的前三季度数字、FY2025全年
  (重述后)、历史对照(FY2024/FY2023, 未被重述调整)、2025分季度、2026Q1、合同负债、分红
  总额与分红率、估值、以及贵州茅台/泸州老窖/白酒行业可比数据——全部为真外部真值, 来自
  官方定期报告与公告。

  第二类(有意不设点值真值): 批价(挂牌口径 vs 实际成交口径, 两者均为区间)、渠道库存(区间)、
  股息率(区间, 分红总额/分红率已独立设点值真值)、回购计划/集团增持计划/账上货币资金(均为
  区间)。gold facts 原文对这些量给出的就是区间或多口径, 不存在单一正确值; 给它们编一个
  点值会惩罚"如实标注区间"这一 gold 明确要求的正确行为, 同时放行伪精确的答案——与
  S12/S13/S14 的 why_no_*_gt 设计原则同源。

  本题最核心的陷阱(gold facts data_inconsistency 列为"本题最高发"): 2025年收入确认口径
  变更导致前三季度存在重述前(609.45亿)与重述后(306.38亿)两套数字, 不可用重述前前三季减
  重述后全年得出Q4负值。这一陷阱由 checkpoint_schema.yaml 的 q_revenue_sum_consistency/
  q_np_sum_consistency 两个 consistency 检查点机械核验(候选作品自己报的四个季度数字之和
  必须等于自己报的全年数字), 不需要外部真值。
