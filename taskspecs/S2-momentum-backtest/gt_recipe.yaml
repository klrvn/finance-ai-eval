recipe_id: momentum_backtest
kind: calculator
calculator:
  script: skills/eval-groundtruth/scripts/momentum_backtest.py
  sidecar: skills/eval-groundtruth/scripts/momentum_backtest.calculator.yaml
  invocation: "--prices {prices} --benchmark {benchmark} [--membership {membership}] --start 2019-01-01 --end 2024-12-31 --commission 0.001 --slippage 0.001 --out {out}"
  produces: [ann_return, ann_vol, sharpe, max_drawdown, ann_excess_return, avg_monthly_turnover]
  side_outputs: ["nav.csv (written next to --out)"]
self_check: required        # halts the run if self_check.passed == false
inputs_required:
  - {name: prices.csv,    na_policy: "缺失 -> 指标检查点 NA；仅跑 NAV 复现一致性"}
  - {name: benchmark.csv, na_policy: "缺失 -> ann_excess_return NA"}
  - {name: membership.csv, optional: true}
fixtures:
  dir: fixtures
  files:
    prices: prices.csv        # 499 tickers × 1699 trading days (2018-01-02 ~ 2024-12-31), 后复权收盘价
    benchmark: benchmark.csv  # CSI 300 total return, 1473 days (2019-01-01 ~ 2024-12-31)
    membership: membership.csv # PIT 成分股, 72 个月末 × 300 只/月 (2019-01-31 ~ 2024-12-31)
  groundtruth: groundtruth.json  # 已计算, self_check.passed=true
  nav: nav.csv                  # 1456 行每日 NAV 序列
