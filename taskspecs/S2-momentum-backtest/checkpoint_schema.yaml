# NAV 复现是"从提交的 NAV 文件重算 sharpe/ann_return 是否在容差内"——需重新执行，
# 由专用验证器 nav_reproduction 处理（见 spec.task_validators），而非算术求值器。
# 无 NAV 文件时记 NA，并作为 CF3 的证据输入（既无执行轨迹又无可复现产物 → CF3）。
#
# 偏差评分模式（deviation scoring）：
# 当 spec.yaml 声明 objective_scoring_mode: deviation 时，数值型检查点（pct/number/bp/yr/ratio）
# 不再使用二元通过/失败，而是按偏差大小连续评分：
#   delta ≤ tol          → score = 1.0（满分，与通过等价）
#   tol < delta < max_dev → score = 1 - (delta - tol) / (max_dev - tol)（线性衰减）
#   delta ≥ max_dev       → score = 0.0（零分）
# grounding_pass_fraction / methodology_pass_fraction 变为各检查点 deviation_score 的加权均值，
# 而非二元通过计数比例。这使"接近正确"与"完全错误"产生区分度。
#
# deviation_scoring.max_dev 的取值依据：
#   - 参考 GT 值的量级与业务含义，设定"偏差大到完全不可接受"的阈值
#   - 对于百分比类指标（pct），max_dev 通常为 10-20 倍 tol
#   - 对于无量纲比率（如 sharpe），max_dev 通常为 5-10 倍 tol
fields:
  ann_return:
    type: pct
    tol: 0.0025
    grounding: true
    methodology: true
    deviation_scoring:
      max_dev: 0.05
      description: "年化收益率偏差 ≥ 5% 视为完全错误（GT≈6.9%，50% 相对偏差）"
  ann_vol:
    type: pct
    tol: 0.0025
    grounding: true
    methodology: true
    deviation_scoring:
      max_dev: 0.05
      description: "年化波动率偏差 ≥ 5% 视为完全错误（GT≈19.8%，25% 相对偏差）"
  sharpe:
    type: number
    tol: 0.05
    grounding: true
    methodology: true
    deviation_scoring:
      max_dev: 0.5
      description: "夏普比率偏差 ≥ 0.5 视为完全错误（GT≈0.44，超过 100% 相对偏差）"
  max_drawdown:
    type: pct
    tol: 0.0025
    grounding: true
    methodology: true
    deviation_scoring:
      max_dev: 0.05
      description: "最大回撤偏差 ≥ 5% 视为完全错误（GT≈-39%，约 13% 相对偏差）"
  ann_excess_return:
    type: pct
    tol: 0.0025
    grounding: true
    methodology: true
    deviation_scoring:
      max_dev: 0.05
      description: "年化超额收益偏差 ≥ 5% 视为完全错误（GT≈-0.4%，偏差量级远超 GT 本身）"
  avg_monthly_turnover:
    type: pct
    tol: 0.01
    methodology: true
    deviation_scoring:
      max_dev: 0.3
      description: "月均换手率偏差 ≥ 30% 视为完全错误（GT≈56.4%，约 53% 相对偏差）"
  nav_series_present:
    type: present
  charts_present:
    type: count_min
    target: 2
  nav_reproduces_metrics:
    type: consistency
    validator: nav_reproduction
    note: "recompute sharpe & ann_return from submitted NAV within tol"
