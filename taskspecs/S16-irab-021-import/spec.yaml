task_id: S16
version: 1.0.0
family: equity-fundamentals
tier: T2
persona: 银行业股票研究员

# prompt_text 由 irab-021 原题面扩写而来 -- 逐字对照见 provenance.json 的
# prompt_deviation_from_irab。扩写只做口径/时点/单位声明,不改变题面本身要求的交付物。
prompt_text: |
  对招商银行（600036.SH）2025 年度报告做杜邦分解：ROE = 净利率 × 总资产周转率 × 权益乘数，
  给出三个因子各自的数值和乘积，并与 2024 年度报告的同口径因子对比，说明 ROE 变动主要由哪个
  因子驱动（需要给出量化的驱动分析，不要只做方向性的定性描述）。

  口径声明要求（请在正文中明确声明并全文保持一致）：
  - 数据基准时点（as-of）：本任务以招商银行2025年年度报告（披露日期2026-03-27）及作为对比
    基准的2024年年度报告为准。请使用这两期年报披露的数据，不要用2026年后续季度报告（如
    2026年一季报）的数据替代或混入2025年报数据；此基准时点之后发生的事件不在本次分析范围内。
  - 净利率的分子请说明使用的是"归属于本行股东的净利润"还是"合并净利润（含少数股东损益）"。
  - 总资产周转率与权益乘数的分母，可采用期末口径（年末总资产/年末归母权益）或平均口径
    （年初年末平均总资产/平均归母权益），两者均为合理做法，但分子分母须同口径，且 2025 与
    2024 两年对比须使用同一种口径。
  - 权益乘数分母是否剔除归母权益中的其他权益工具（优先股、永续债），请明确说明。
  - 三因子乘积与年报披露的加权平均净资产收益率（ROAE）可能不是同一个数（两者分子分母口径
    可以不同）。请如实报告你计算出的乘积，如果与年报披露 ROAE 不同，请说明差异可能来自哪里，
    不要为了让乘积"凑成"披露值而反向调整任一因子。
  - 请使用招商银行 A 股定期报告披露的官方数据（2025 年年度报告及作为对比基准的 2024 年年度
    报告），并注明数据来源与披露日期。

measurable_outputs:
  - 2025 年报三因子数值（净利率、总资产周转率、权益乘数），并注明所用口径
  - 2024 年报同口径的三因子数值，作为对比基准
  - 两年各自的三因子乘积（=归母净利润/归母权益，与年报披露 ROAE 是两套口径，不应混为一谈）
  - 与 2024 年相比，各因子的变动方向与幅度
  - 量化的驱动归因：ROE 变动主要由哪个因子驱动，需有贡献拆解支撑（如连环替代法/对数分解）

# ---------------------------------------------------------------------------
# 权重理由：
#   D2=30（本容器主维度）：本题的核心可核验性结构是"三因子乘积能否闭环"——这是一个封闭代数
#     恒等式（类比 S1 杜邦分析），闭环关系由 D2 第一层的两个 consistency 检查点承载。
#   D1=20：取数是否扎实（营业收入/净利润/总资产/权益/披露ROAE等13个外部锚点）。
#   D3=20：五要素交付物是否齐全（两年因子+乘积+对比+量化归因）。
#   D4=20：归因分析深度（是否用了连环替代法/对数分解，是否识别口径混淆陷阱）。
#   D5=5：本题不涉及投资建议，权重给到底线之上一点，覆盖"结论是否可用于同业对比"这类弱可操作性。
#   D6=5（宪法下限）：是否真的用工具/公式算出三因子，而非手算凑数。
# ---------------------------------------------------------------------------
rubric_weights: {D1: 20, D2: 30, D3: 20, D4: 20, D5: 5, D6: 5}

objective_dims: [D1, D2]
objective_scoring_mode: binary

citation_policy: {mode: none}
# D1 的取数准确性已由 grounding 检查点直接核验，本题不额外做引用抽样核验。

cf_rules: [CF1, CF5]
# CF2 不启用：citation_policy=none。
# CF3 不启用：D2(30) 已是本容器权重最高的维度，"没真算出三因子闭环"这一失败模式已经由
#   roe_closure_2025/2024 两个 consistency 检查点必然抓住（乘积与自报因子对不上则直接 fail），
#   叠加 D6 的工具链扣分，比 CF3 一刀切封顶更精准（S12 先例）。
# CF4 不启用：本题固定评 2025/2024 两个已披露报告期，不存在"当前 vs 陈旧"的时点滑动场景。
cf_thresholds: {}

required_inputs:
  - name: groundtruth_snapshot.json
    needed_for: "GT 答案键的可读镜像/可选 override；默认 GT 为计算器内嵌的冻结值"
    na_policy: "计算器默认使用内嵌答案键，不依赖此文件"

task_validators:
  - {name: roe_closure, realized_by: "checkpoint roe_closure_2025/roe_closure_2024（consistency，三因子乘积与自报净利率×周转率×权益乘数必须闭环）"}
  - {name: caliber_discipline, realized_by: "checkpoint turnover_*/leverage_*/roe_product_*（number/pct/ratio, gt_variants 按 caliber_declared 路由到期末/平均口径序列）"}
  - {name: roae_conflation_guard, realized_by: "disclosed_roae_*/disclosed_roaa_* 作为独立 grounding 锚点，不与三因子乘积设相等关系检查点——判官在 D1/D2 第二层核查是否混淆"}

engine_requirements:
  calculator: irab_021_anchors
  gt_kind: calculator
  gt_version: "1.0"
  checkpoint_types: [number, pct, ratio, present, consistency]
  tolerance_policy: >
    原始财务数据（营业收入/净利润/总资产/权益）tol 0.5% 相对——年报数字通常精确到分，0.5%
    足够严格又能容纳单位换算的舍入。净利率/周转率/三因子乘积 tol 0.06pp（0.0006）——对齐
    gold facts 自己标注的"容差±0.10pp"量级并略紧。权益乘数（倍数）tol 0.02（绝对）。
    披露 ROAE/ROAA tol 0.05pp——年报披露值本身就是精确到两位小数的官方数字。
    roe_closure 的 consistency 检查点 tol 2% 相对——只核验候选作品自己的三因子乘积与自报
    三因子相乘的偏差，不掺入取数误差。
  data_fetch_mode: "frozen_snapshot（网络无关，计算器内嵌冻结值，数据基准为招商银行 2025 年年度报告，2026-03-27 披露）"
  min_grader_version: "1.1"
  min_aggregator_version: "2.3"
