self_check: >
  12 项: GT值数量与声明一致; 全部为有限数值; 重述前后前三季营收/净利润确实不同且重述前更高
  (发货确认早于终端动销确认); 四季度营收/净利润之和与全年一致(±0.05/±0.1亿, 验证转录数字
  没算错); 真实Q4营收明显偏离"重述前前三季-重述后全年"这一跨口径混算得出的错误值(相差>50亿);
  2026Q1营收/净利润为正; 2025年重述后归母净利润仍为正; 毛利率落在合理区间; 五粮液PE(TTM)
  明显偏高、茅台PE(TTM)明显更低(印证五粮液PE(TTM)因重述而失真, 不可直接横向比较)。
scale: "亿元 for absolute financials; fraction for pct fields (44.49%->0.4449 风格); PE/PB 为纯比率。"
out_of_scope: >
  批价(挂牌 vs 实际成交)、渠道库存、股息率、回购/集团增持计划、账上货币资金——gold facts
  原文对这些量给出的是区间或多口径, 不存在单一正确值, 不设点值真值(见脚本内
  provenance.coverage_gaps)。给这些量编一个点值会惩罚"如实标注区间"这一 gold 明确要求的
  正确行为, 同时放行伪精确的答案。
data_cutoff: "约2026-06-12(估值数据基准); 财务数据基准为2026-04-30披露的FY2025年报与随后的2026Q1季报"
