calculator_id: fund_metrics
script: fund_metrics.py
version: "1.0"
family: fund-screen
deterministic: true
network: false
requires: [pandas, numpy]
invocation: "--navs {fundA.csv} {fundB.csv} ... --static {static.csv} --rf 0.0 --out {out}"
inputs:
  "fund NAV csvs": "each with columns date, nav (fund identified by filename stem)"
  static.csv: "columns: fund, expense_ratio, aum (passthrough; not computable)"
outputs_per_fund: [ann_return_3y, ann_return_5y, ann_vol, sharpe, max_drawdown]
passthrough: [expense_ratio, aum]
needs_authoritative_navs: true   # if absent, metric_cells_verified -> NA
self_check: "emits self_check{passed}; dispatcher halts on passed==false"
